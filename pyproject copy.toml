[project]
name = "AI-SOC"
version = "1.0.0"
description = "Multi-agent AI system for autonomous security alert investigation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
